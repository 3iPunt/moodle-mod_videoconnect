# Code validation before the plugin reaches develop. One row per branch in
# $plugin->supported (catalogue norm: 4.5, 5.1 and 5.3), all on PHP 8.3, the only
# version the three share. The rows run in parallel: same wall time as one row, but
# Bitbucket Pipelines bills each row's minutes (three rows, three times the minutes).
image: moodlehq/moodle-php-apache:8.3

definitions:
  services:
    mariadb:
      image: mariadb:11
      memory: 1024
      variables:
        MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        MYSQL_CHARACTER_SET_SERVER: 'utf8mb4'
        MYSQL_COLLATION_SERVER: 'utf8mb4_unicode_ci'

  steps:
    - step: &moodle-plugin-ci
        name: Moodle Plugin CI
        # 1x keeps the minute cost down. If PHPUnit runs out of memory,
        # add "size: 2x" here: double RAM, double minutes.
        services:
          - mariadb
        caches:
          - composer
        script:
          - export DB=mariadb
          # Outside the parallel group (tip ci), the highest branch: the amd/build one.
          - export MOODLE_BRANCH=MOODLE_503_STABLE
          # Inside it, the row index picks the branch, in the order of the rows below.
          - case "${BITBUCKET_PARALLEL_STEP:-}" in 0) MOODLE_BRANCH=MOODLE_405_STABLE ;; 1) MOODLE_BRANCH=MOODLE_501_STABLE ;; esac
          - echo "Moodle branch $MOODLE_BRANCH"
          - export NVM_DIR="$HOME/.nvm"
          # Composer disables its plugins for root unless told otherwise.
          - export COMPOSER_ALLOW_SUPERUSER=1
          - git config --global --add safe.directory '*'
          - locale-gen en_AU.UTF-8 || true
          # The mustache lint runs the W3C validator, a .jar: the image has no Java.
          - apt-get update -qq && apt-get install -y -qq --no-install-recommends default-jre-headless
          # Node must exist before composer create-project, which runs npm install.
          # lts/jod is the .nvmrc of Moodle 4.5, 5.1 and 5.3.
          - if [ ! -s "$NVM_DIR/nvm.sh" ]; then curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash; fi
          - . "$NVM_DIR/nvm.sh"
          - nvm install lts/jod
          # moodle-plugin-ci installs Moodle as a sibling of the plugin.
          - mkdir -p /opt/ci-workspace
          - cp -a "$BITBUCKET_CLONE_DIR" /opt/ci-workspace/plugin
          - cd /opt/ci-workspace
          - if ! command -v composer >/dev/null 2>&1; then curl -fsSL https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer; fi
          - composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          - export PATH="/opt/ci-workspace/ci/bin:/opt/ci-workspace/ci/vendor/bin:$PATH"
          # Only if the plugin declares $plugin->dependencies: add each one,
          # pinned to a released tag so upstream commits cannot break the build.
          # - moodle-plugin-ci add-plugin --branch vX.Y.Z <owner>/<repo>
          # A private Bitbucket dependency is cloned over SSH: ask sistemas, before the
          # first pull request, to add this repository's Pipelines SSH key as a read-only
          # access key on each dependency's repository. Without it every build stops
          # here with "Permission denied (publickey)".
          # - moodle-plugin-ci add-plugin --clone "git@bitbucket.org:tresipunt/<repo>.git" --branch vX.Y.Z
          - moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
          - moodle-plugin-ci phplint
          - moodle-plugin-ci phpcs --max-warnings 0
          - moodle-plugin-ci phpdoc --max-warnings 0
          - moodle-plugin-ci validate
          - moodle-plugin-ci savepoints
          - moodle-plugin-ci mustache
          # Only on the branch amd/build is compiled with: grunt rebuilds it and compares
          # byte by byte, and another branch's grunt may produce a different build.
          - if [ "$MOODLE_BRANCH" = MOODLE_503_STABLE ]; then moodle-plugin-ci grunt --max-lint-warnings 0; fi
          - moodle-plugin-ci phpunit --fail-on-warning
          # Behat is left out on purpose: Selenium and Chrome multiply the minutes.

pipelines:
  # Only on pull requests: the cost follows deliveries, not every push.
  # The order of the rows is the index the script maps to a branch: keep it.
  pull-requests:
    '**':
      - parallel: &matrix
          - step:
              <<: *moodle-plugin-ci
              name: Moodle 4.5 · PHP 8.3
          - step:
              <<: *moodle-plugin-ci
              name: Moodle 5.1 · PHP 8.3
          - step:
              <<: *moodle-plugin-ci
              name: Moodle 5.3 · PHP 8.3

  custom:
    manual:
      - parallel: *matrix
